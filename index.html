<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 블로그 포스팅 누락 체커</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
    <style> body { font-family: 'Pretendard', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-10 px-4">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">최근 포스팅 노출/누락 체커</h1>
            <p class="text-slate-600">내 블로그 ID를 입력하여 최근 글들의 네이버 색인 상태를 확인하세요.</p>
        </header>

        <!-- 입력 영역 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8 flex gap-3">
            <input type="text" id="blogIdInput" placeholder="네이버 블로그 아이디 입력 (예: myblogid)" 
                class="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
            <button onclick="checkBlogPosts()" id="searchBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-3 rounded-xl transition-colors text-sm cursor-pointer">
                조회하기
            </button>
        </div>

        <!-- 결과 영역 -->
        <div id="resultContainer" class="hidden">
            <div class="flex gap-2 mb-4">
                <span id="badgeTotal" class="bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs font-semibold">전체 0</span>
                <span id="badgeIndexed" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-semibold">노출 0</span>
                <span id="badgeMissing" class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-semibold">누락 0</span>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100/70 border-b border-slate-200 text-xs font-semibold text-slate-600">
                            <th class="py-3.5 px-4 w-24">상태</th>
                            <th class="py-3.5 px-4">글 제목</th>
                            <th class="py-3.5 px-4 w-40">발행일</th>
                            <th class="py-3.5 px-4 w-44 text-center">바로가기</th>
                        </tr>
                    </thead>
                    <tbody id="postTableBody" class="divide-y divide-slate-100 text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://your-worker-subdomain.workers.dev"; // 본인 Worker URL 입력

        async function checkBlogPosts() {
            const blogId = document.getElementById('blogIdInput').value.trim();
            if (!blogId) {
                alert('블로그 아이디를 입력하세요.');
                return;
            }

            const tbody = document.getElementById('postTableBody');
            const resultContainer = document.getElementById('resultContainer');
            const searchBtn = document.getElementById('searchBtn');

            searchBtn.disabled = true;
            resultContainer.classList.remove('hidden');

            let seconds = 0;
            tbody.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-slate-500 font-medium">
                포스팅 상태를 조회 중입니다... (<span id="timer" class="text-emerald-600 font-bold">0</span>초 경과) | <span id="progressText" class="text-indigo-600 font-bold">준비 중...</span>
            </td></tr>`;
            
            const timerInterval = setInterval(() => {
                seconds++;
                const timerEl = document.getElementById('timer');
                if (timerEl) timerEl.innerText = seconds;
            }, 1000);

            // 가상으로 조회 진행 상황을 보여주기 위한 인터벌 (체감 속도 개선)
            let fakeProgress = 1;
            const progressInterval = setInterval(() => {
                const progEl = document.getElementById('progressText');
                if (progEl && fakeProgress < 50) {
                    progEl.innerText = `조회 중 (${fakeProgress} / 확인 중...)`;
                    fakeProgress += Math.floor(Math.random() * 3) + 1;
                }
            }, 800);

            try {
                const res = await fetch(`${WORKER_URL}?blogId=${blogId}`);
                const data = await res.json();

                clearInterval(timerInterval);
                clearInterval(progressInterval);
                searchBtn.disabled = false;

                if (data.error) {
                    alert('오류 발생: ' + data.error);
                    return;
                }

                renderResults(data.posts);
            } catch (err) {
                clearInterval(timerInterval);
                clearInterval(progressInterval);
                searchBtn.disabled = false;
                alert('데이터를 불러오는데 실패했습니다.');
                tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-red-500">데이터 조회 실패</td></tr>`;
            }
        }

        function renderResults(posts) {
            const tbody = document.getElementById('postTableBody');
            tbody.innerHTML = '';

            let indexedCount = 0;
            let missingCount = 0;

            posts.forEach(post => {
                const isIndexed = post.status === "노출";
                if (isIndexed) indexedCount++; else missingCount++;

                const statusBadge = isIndexed
                    ? `<span class="bg-blue-100 text-blue-700 px-2.5 py-1 rounded-md text-xs font-semibold">노출</span>`
                    : `<span class="bg-red-100 text-red-700 px-2.5 py-1 rounded-md text-xs font-semibold">누락</span>`;

                let formattedDate = post.pubDate;
                const dateMatch = post.pubDate.match(/^(\d{4})-(\d{2})-(\d{2})\s(.+)$/);
                if (dateMatch) {
                    formattedDate = `${dateMatch[1]}년 ${parseInt(dateMatch[2])}월 ${parseInt(dateMatch[3])}일 ${dateMatch[4]}`;
                }

                const searchUrl = `https://search.naver.com/search.naver?where=view&query=${encodeURIComponent('"' + post.title + '"')}`;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/80 transition-colors';
                tr.innerHTML = `
                    <td class="py-3.5 px-4">${statusBadge}</td>
                    <td class="py-3.5 px-4 font-medium text-slate-800">${escapeHtml(post.title)}</td>
                    <td class="py-3.5 px-4 text-xs text-slate-500">${formattedDate}</td>
                    <td class="py-3.5 px-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <a href="${post.link}" target="_blank" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg font-medium transition-colors">블로그글</a>
                            <a href="${searchUrl}" target="_blank" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-lg font-medium transition-colors">검색결과</a>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('badgeTotal').innerText = `전체 ${posts.length}`;
            document.getElementById('badgeIndexed').innerText = `노출 ${indexedCount}`;
            document.getElementById('badgeMissing').innerText = `누락 ${missingCount}`;
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }
    </script>
</body>
</html>
